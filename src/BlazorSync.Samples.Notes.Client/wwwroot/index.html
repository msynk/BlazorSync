<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorSync Notes</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; }
        #update-banner { background: #fff4ce; border: 1px solid #c9a400; padding: .5rem; margin-bottom: 1rem; }
        li { margin: .25rem 0; }
    </style>
</head>
<body>
    <div id="update-banner" hidden>
        A new version is available. Your unsynced notes are kept.
        <button id="apply-update" type="button">Reload</button>
    </div>
    <div id="app">Loading…</div>

    <script>
        // Service-worker update lifecycle: a new version installs in the background and waits; the user
        // chooses when to switch. Pending notes live in IndexedDB, so switching never loses them.
        if ("serviceWorker" in navigator) {
            const showBanner = () => document.getElementById("update-banner").hidden = false;
            navigator.serviceWorker.register("service-worker.js").then(registration => {
                if (registration.waiting && navigator.serviceWorker.controller) showBanner();
                registration.addEventListener("updatefound", () => {
                    const worker = registration.installing;
                    worker.addEventListener("statechange", () => {
                        if (worker.state === "installed" && navigator.serviceWorker.controller) showBanner();
                    });
                });
                window.blazorSyncCheckForUpdate = () => registration.update();
            });
            let reloading = false;
            navigator.serviceWorker.addEventListener("controllerchange", () => {
                if (!reloading) { reloading = true; location.reload(); }
            });
            document.getElementById("apply-update").addEventListener("click", async () => {
                const registration = await navigator.serviceWorker.getRegistration();
                if (registration && registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
            });
        }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
